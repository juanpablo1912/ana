<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MY STYLE AND MY RULES ♡ — Realistic Fashion Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass-lilac: rgba(142, 114, 148, 0.42);
      --glass-lilac-strong: rgba(124, 96, 130, 0.58);
      --glass-card: rgba(245, 236, 246, 0.72);
      --border-glow: rgba(255, 255, 255, 0.65);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #2b212c;
    }

    .font-logo {
      font-family: 'Cinzel Decorative', 'Cormorant Garamond', serif;
    }

    .font-editorial {
      font-family: 'Cormorant Garamond', serif;
    }

    .font-wall-script {
      font-family: 'Caveat', cursive;
    }

    /* Glassmorphism Exact Match to Reference */
    .ui-glass {
      background: linear-gradient(145deg, rgba(168, 138, 173, 0.46), rgba(118, 92, 124, 0.52));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.25px solid rgba(255, 255, 255, 0.58);
      box-shadow: 0 8px 28px rgba(32, 18, 38, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.45);
    }

    .ui-glass-btn {
      background: linear-gradient(160deg, rgba(164, 134, 168, 0.52), rgba(112, 86, 118, 0.58));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.2px solid rgba(255, 255, 255, 0.62);
      box-shadow: 0 4px 16px rgba(28, 14, 34, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ui-glass-btn:hover:not(:disabled) {
      background: linear-gradient(160deg, rgba(190, 155, 195, 0.65), rgba(135, 102, 142, 0.68));
      border-color: rgba(255, 255, 255, 0.9);
      transform: translateY(-1px);
    }

    .ui-glass-btn:active:not(:disabled) {
      transform: scale(0.94);
    }

    .wardrobe-window {
      background: linear-gradient(165deg, rgba(164, 135, 168, 0.48), rgba(116, 90, 122, 0.56));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(255, 255, 255, 0.68);
      box-shadow: 0 16px 44px rgba(24, 12, 30, 0.32), inset 0 1px 1px rgba(255, 255, 255, 0.55);
    }

    .slot-tile {
      background: linear-gradient(155deg, rgba(250, 242, 250, 0.84), rgba(232, 216, 235, 0.74));
      border: 1.25px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 3px 10px rgba(38, 20, 44, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.85);
      transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .slot-tile:hover {
      background: linear-gradient(155deg, rgba(255, 250, 255, 0.96), rgba(245, 228, 248, 0.9));
      transform: translateY(-1.5px) scale(1.02);
      border-color: #ffffff;
    }

    .slot-tile.active {
      background: linear-gradient(155deg, #fff5fa, #f8d8ea);
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 2px rgba(244, 114, 182, 0.75), 0 6px 16px rgba(219, 39, 119, 0.28);
    }

    .cat-tab {
      background: rgba(248, 238, 250, 0.76);
      border: 1.2px solid rgba(255, 255, 255, 0.7);
      color: #4a354e;
      transition: all 0.18s ease;
    }

    .cat-tab.active {
      background: linear-gradient(180deg, #fff5fa 0%, #f5d0e6 100%);
      border: 1.6px solid #f472b6;
      color: #3b1d3e;
      box-shadow: 0 3px 10px rgba(236, 72, 153, 0.25);
    }

    /* Custom Scrollbars */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Natural Character Animations */
    @keyframes hairSway {
      0%, 100% { transform: rotate(0deg) translateX(0px); }
      50% { transform: rotate(0.55deg) translateX(1px); }
    }

    @keyframes breathCycle {
      0%, 100% { transform: scaleY(1) translateY(0px); }
      50% { transform: scaleY(1.0035) translateY(-0.8px); }
    }

    @keyframes equipPop {
      0% { transform: scale(0.975); opacity: 0.75; }
      60% { transform: scale(1.012); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fairyTwinkle {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.82); }
    }

    @keyframes sparkleRise {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      40% { opacity: 1; transform: translateY(-22px) scale(1.15); }
      100% { transform: translateY(-48px) scale(0.4); opacity: 0; }
    }

    .anim-hair {
      transform-origin: 200px 92px;
      animation: hairSway 5.6s ease-in-out infinite;
    }

    .anim-breath {
      transform-origin: 200px 450px;
      animation: breathCycle 4.4s ease-in-out infinite;
    }

    .paused-anims .anim-hair,
    .paused-anims .anim-breath {
      animation: none !important;
    }

    .equip-pop {
      animation: equipPop 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .eyelid-group {
      transform-origin: 200px 98px;
      transition: transform 0.08s ease-in-out;
    }
    .eyelid-closed {
      transform: scaleY(0.07);
    }

    .fairy-bulb {
      animation: fairyTwinkle 2.8s ease-in-out infinite;
    }

    .logo-glow {
      text-shadow: 0 2px 12px rgba(255, 255, 255, 0.75), 0 0 24px rgba(244, 114, 182, 0.65), 0 2px 4px rgba(45, 20, 48, 0.55);
    }

    #camera-flash {
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease-out;
    }
    #camera-flash.active {
      opacity: 1;
      transition: none;
    }
  </style>
</head>
<body>

  <!-- FULLSCREEN INTERACTIVE STUDIO SCENE -->
  <div id="studio-root" class="relative w-full h-full overflow-hidden flex items-center justify-center bg-[#d7bfd8]">

    <!-- Camera Flash Overlay -->
    <div id="camera-flash" class="fixed inset-0 bg-white z-50"></div>

    <!-- Sparkle Particles Layer -->
    <div id="sparkle-layer" class="pointer-events-none fixed inset-0 z-40 overflow-hidden"></div>

    <!-- Floating Toast Notification -->
    <div id="toast-banner" class="pointer-events-none fixed top-16 left-1/2 -translate-x-1/2 z-50 opacity-0 -translate-y-2 transition-all duration-300">
      <div class="ui-glass px-4 py-1.5 rounded-full flex items-center gap-2 text-white shadow-xl">
        <span id="toast-icon"></span>
        <span id="toast-text" class="text-xs font-semibold tracking-wide drop-shadow"></span>
      </div>
    </div>

    <!-- =========================================================================
         1. AESTHETIC PASTEL PINK / LILAC BEDROOM BACKGROUND + DYNAMIC MIRROR
         ========================================================================= -->
    <svg id="room-backdrop-svg" viewBox="0 0 1440 1024" preserveAspectRatio="xMidYMid slice" class="absolute inset-0 w-full h-full pointer-events-none">
      <defs>
        <!-- Soft Atmospheric Room Wall Gradients -->
        <linearGradient id="wall-left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#c9b2ca"/>
          <stop offset="55%" stop-color="#dfc8df"/>
          <stop offset="100%" stop-color="#cbb2cc"/>
        </linearGradient>
        <linearGradient id="wall-center-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#d5bdd6"/>
          <stop offset="35%" stop-color="#ead7ea"/>
          <stop offset="70%" stop-color="#e3cee4"/>
          <stop offset="100%" stop-color="#c3aac5"/>
        </linearGradient>
        <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#bfa8c0"/>
          <stop offset="40%" stop-color="#ccb6cd"/>
          <stop offset="100%" stop-color="#a890aa"/>
        </linearGradient>
        <radialGradient id="fluffy-rug-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f7ebf7"/>
          <stop offset="68%" stop-color="#ebd8ec"/>
          <stop offset="92%" stop-color="#d7bfd8"/>
          <stop offset="100%" stop-color="#bfa6c1" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="mirror-glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e7d6e8"/>
          <stop offset="45%" stop-color="#f4e8f5"/>
          <stop offset="100%" stop-color="#cbb4cc"/>
        </linearGradient>
        <linearGradient id="silver-frame" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#9ca3af"/>
          <stop offset="45%" stop-color="#f3f4f6"/>
          <stop offset="100%" stop-color="#6b7280"/>
        </linearGradient>
        <radialGradient id="bulb-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
          <stop offset="35%" stop-color="#fef3c7" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#f9a8d4" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft-blur" x="-15%" y="-15%" width="130%" height="130%">
          <feGaussianBlur stdDeviation="3.5"/>
        </filter>
        <filter id="mirror-blur" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur stdDeviation="1.4"/>
        </filter>
        <clipPath id="mirror-clip">
          <polygon points="106,184 328,204 328,768 106,796"/>
        </clipPath>
      </defs>

      <!-- Bedroom Walls & Perspective Corner -->
      <rect width="1440" height="1024" fill="url(#wall-center-grad)"/>
      <polygon points="0,0 385,0 385,785 0,860" fill="url(#wall-left-grad)"/>
      <line x1="385" y1="0" x2="385" y2="785" stroke="#b399b5" stroke-width="2.5" opacity="0.65"/>

      <!-- Bedroom Floor & Baseboard -->
      <polygon points="0,860 385,785 1440,785 1440,1024 0,1024" fill="url(#floor-grad)"/>
      <polygon points="0,844 385,772 1440,772 1440,786 385,786 0,862" fill="#e6d3e7" opacity="0.85"/>

      <!-- Fluffy Round Pastel Pink Rug under Ana -->
      <ellipse cx="635" cy="872" rx="345" ry="74" fill="url(#fluffy-rug-grad)"/>
      <ellipse cx="635" cy="874" rx="295" ry="56" fill="#f5e6f5" opacity="0.55" filter="url(#soft-blur)"/>

      <!-- Pastel Pink Bed & Giant Cute Plushie on Right Background -->
      <g opacity="0.88">
        <!-- Bed Headboard & Mattress -->
        <rect x="755" y="545" width="220" height="155" rx="22" fill="#e3bdd4" stroke="#cfa4be" stroke-width="2"/>
        <path d="M740,665 Q860,648 995,668 L1015,795 L735,795 Z" fill="#ebd2e2"/>
        <path d="M745,705 Q865,688 1005,710 L1015,795 L740,795 Z" fill="#d9b4cb"/>
        <!-- Cute White Kitty Plushie on Bed -->
        <g transform="translate(822, 578)">
          <ellipse cx="42" cy="78" rx="32" ry="26" fill="#f4a8c8"/>
          <ellipse cx="42" cy="40" rx="34" ry="26" fill="#fffafc"/>
          <polygon points="15,24 12,4 30,17" fill="#fffafc"/>
          <polygon points="69,24 72,4 54,17" fill="#fffafc"/>
          <circle cx="28" cy="41" r="2.8" fill="#271c29"/>
          <circle cx="56" cy="41" r="2.8" fill="#271c29"/>
          <ellipse cx="42" cy="46" rx="3.5" ry="2.2" fill="#fbbf24"/>
          <path d="M62,16 L54,11 L55,21 Z M62,16 L70,11 L69,21 Z" fill="#ec4899"/>
        </g>
      </g>

      <!-- Aesthetic Wall Posters & Collages -->
      <g opacity="0.9">
        <!-- "I ♥ NY" Poster -->
        <g transform="translate(736, 178)">
          <rect width="74" height="96" rx="3" fill="#231f24" stroke="#473c49" stroke-width="2"/>
          <text x="22" y="44" fill="#ffffff" font-family="Georgia, serif" font-weight="bold" font-size="28">I</text>
          <path d="M48,30 C44,24 36,26 36,33 C36,40 48,47 48,47 C48,47 60,40 60,33 C60,26 52,24 48,30 Z" fill="#e11d48"/>
          <text x="37" y="80" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-weight="bold" font-size="27">NY</text>
        </g>

        <!-- Vintage Aesthetic Collage Posters above -->
        <g transform="translate(740, 26)">
          <rect width="72" height="128" rx="3" fill="#2c242e"/>
          <rect x="8" y="10" width="24" height="32" fill="#f9a8d4" opacity="0.7"/>
          <rect x="38" y="16" width="26" height="26" fill="#e9d5ff" opacity="0.75"/>
          <rect x="10" y="52" width="52" height="30" fill="#fce7f3" opacity="0.65"/>
          <rect x="12" y="90" width="22" height="28" fill="#fbcfe8" opacity="0.7"/>
          <rect x="40" y="92" width="22" height="26" fill="#ddd6fe" opacity="0.7"/>
        </g>

        <!-- Pastel Kitty Wall Art Poster -->
        <g transform="translate(838, 224)">
          <rect width="108" height="128" rx="4" fill="#f7e6f2" stroke="#e5c8dc" stroke-width="2"/>
          <ellipse cx="54" cy="64" rx="32" ry="24" fill="#ffffff"/>
          <polygon points="27,48 25,28 42,41" fill="#ffffff"/>
          <polygon points="81,48 83,28 66,41" fill="#ffffff"/>
          <circle cx="41" cy="64" r="2.6" fill="#271c29"/>
          <circle cx="67" cy="64" r="2.6" fill="#271c29"/>
          <ellipse cx="54" cy="69" rx="3.2" ry="2" fill="#f59e0b"/>
          <path d="M74,40 L66,35 L67,45 Z M74,40 L82,35 L81,45 Z" fill="#f472b6"/>
        </g>

        <!-- Glowing Pink Star Wall Sticker -->
        <polygon points="866,184 871,196 884,197 874,205 877,218 866,211 855,218 858,205 848,197 861,196"
                 fill="#f9a8d4" stroke="#ffffff" stroke-width="1.2"/>

        <!-- Handwritten Cursive Wall Quote ("Sonhe, Vista-se, Conquiste ♡") -->
        <g transform="translate(835, 412) rotate(-3)" fill="#6e5470" opacity="0.78">
          <text x="0" y="0" class="font-wall-script" font-size="31">Sonhe,</text>
          <text x="-8" y="34" class="font-wall-script" font-size="31">Vista-se,</text>
          <text x="-14" y="68" class="font-wall-script" font-size="31">Conquiste</text>
          <text x="34" y="98" class="font-wall-script" font-size="28" fill="#9d5c84">♡</text>
        </g>
      </g>

      <!-- =======================================================================
           FULL-LENGTH VANITY MIRROR WITH LIVE BACK-VIEW REFLECTION OF ANA
           ======================================================================= -->
      <g id="vanity-mirror-group">
        <!-- Mirror Outer Drop Shadow -->
        <polygon points="94,174 338,196 338,778 94,808" fill="#4a354e" opacity="0.28" filter="url(#soft-blur)"/>
        <!-- Mirror Metallic Frame -->
        <polygon points="98,176 336,198 336,774 98,804" fill="url(#silver-frame)" stroke="#e5e7eb" stroke-width="2"/>
        <!-- Mirror Glass Surface -->
        <polygon points="106,184 328,204 328,768 106,796" fill="url(#mirror-glass-grad)"/>

        <!-- Clipped Mirror Interior: Room Reflection + Live Synchronized Ana Reflection -->
        <g clip-path="url(#mirror-clip)" filter="url(#mirror-blur)">
          <!-- Reflected Wall & Floor Line -->
          <polygon points="106,660 328,645 328,768 106,796" fill="#bfa6c2" opacity="0.65"/>
          <ellipse cx="225" cy="738" rx="95" ry="22" fill="#f5e6f5" opacity="0.7"/>

          <!-- LIVE REFLECTION OF ANA (Mirrors her exact current outfit in back/three-quarter angle!) -->
          <g id="mirror-ana-reflection" transform="translate(76, 178) scale(0.73)" opacity="0.93"></g>

          <!-- Subtle Glass Diagonal Reflection Sheen -->
          <polygon points="106,184 225,194 140,792 106,796" fill="#ffffff" opacity="0.14"/>
        </g>

        <!-- Glowing Vanity Fairy Lights along Mirror Frame -->
        <g id="mirror-fairy-lights">
          <circle cx="102" cy="215" r="7" fill="url(#bulb-glow)" class="fairy-bulb"/>
          <circle cx="102" cy="285" r="7" fill="url(#bulb-glow)" class="fairy-bulb" style="animation-delay:0.4s"/>
          <circle cx="102" cy="355" r="7" fill="url(#bulb-glow)" class="fairy-bulb" style="animation-delay:0.8s"/>
          <circle cx="102" cy="425" r="7" fill="url(#bulb-glow)" class="fairy-bulb" style="animation-delay:1.2s"/>
          <circle cx="102" cy="495" r="7" fill="url(#bulb-glow)" class="fairy-bulb" style="animation-delay:1.6s"/>
          <circle cx="102" cy="565" r="7" fill="url(#bulb-glow)" class="fairy-bulb" style="animation-delay:2.0s"/>
          <circle cx="102" cy="635" r="7" fill="url(#bulb-glow)" class="fairy-bulb" style="animation-delay:0.6s"/>
          <circle cx="102" cy="705" r="7" fill="url(#bulb-glow)" class="fairy-bulb" style="animation-delay:1.1s"/>

          <circle cx="332" cy="230" r="6.5" fill="url(#bulb-glow)" class="fairy-bulb" style="animation-delay:0.3s"/>
          <circle cx="332" cy="305" r="6.5" fill="url(#bulb-glow)" class="fairy-bulb" style="animation-delay:0.9s"/>
          <circle cx="332" cy="380" r="6.5" fill="url(#bulb-glow)" class="fairy-bulb" style="animation-delay:1.4s"/>
          <circle cx="332" cy="455" r="6.5" fill="url(#bulb-glow)" class="fairy-bulb" style="animation-delay:1.9s"/>
          <circle cx="332" cy="530" r="6.5" fill="url(#bulb-glow)" class="fairy-bulb" style="animation-delay:0.5s"/>
          <circle cx="332" cy="605" r="6.5" fill="url(#bulb-glow)" class="fairy-bulb" style="animation-delay:1.2s"/>
          <circle cx="332" cy="680" r="6.5" fill="url(#bulb-glow)" class="fairy-bulb" style="animation-delay:1.7s"/>
        </g>
      </g>
    </svg>

    <!-- =========================================================================
         2. CENTRAL INTERACTIVE PROTAGONIST STAGE ("Ana ♡")
         ========================================================================= -->
    <main id="stage-viewport" class="relative w-full h-full flex items-center justify-center touch-none z-10">
      <div id="avatar-transform-wrapper" class="w-full h-full flex items-center justify-center md:pr-[240px] lg:pr-[270px] transition-transform duration-300 ease-out cursor-grab active:cursor-grabbing">
        
        <!-- HIGH-DEFINITION ANATOMICAL VECTOR PROTAGONIST (400 x 820 Coordinate System) -->
        <svg id="protagonist-svg" viewBox="0 0 400 820" class="h-[88dvh] sm:h-[91dvh] max-h-[820px] w-auto overflow-visible drop-shadow-[0_18px_28px_rgba(38,18,46,0.28)]" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Realistic Soft Warm Olive-Fair Skin Gradients -->
            <linearGradient id="skin-torso" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#c69376"/>
              <stop offset="22%" stop-color="#e3b599"/>
              <stop offset="50%" stop-color="#f0ccb5"/>
              <stop offset="78%" stop-color="#e3b599"/>
              <stop offset="100%" stop-color="#c28e70"/>
            </linearGradient>
            <radialGradient id="skin-face" cx="50%" cy="42%" r="56%">
              <stop offset="0%" stop-color="#f7dac7"/>
              <stop offset="68%" stop-color="#e5b79b"/>
              <stop offset="100%" stop-color="#c89578"/>
            </radialGradient>
            <linearGradient id="skin-legs" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#c18e71"/>
              <stop offset="32%" stop-color="#ecc7b0"/>
              <stop offset="68%" stop-color="#e2b396"/>
              <stop offset="100%" stop-color="#be8a6c"/>
            </linearGradient>
            <radialGradient id="cheek-tint" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#d66374" stop-opacity="0.44"/>
              <stop offset="70%" stop-color="#e07a88" stop-opacity="0.16"/>
              <stop offset="100%" stop-color="#e07a88" stop-opacity="0"/>
            </radialGradient>

            <!-- Deep Dark Brown / Jet Black Hair with Silky Highlights -->
            <linearGradient id="hair-jet" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#140f10"/>
              <stop offset="45%" stop-color="#231b1c"/>
              <stop offset="80%" stop-color="#120d0e"/>
              <stop offset="100%" stop-color="#090708"/>
            </linearGradient>
            <linearGradient id="hair-silk-shine" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
              <stop offset="38%" stop-color="#9f8b92" stop-opacity="0.22"/>
              <stop offset="52%" stop-color="#ffffff" stop-opacity="0.18"/>
              <stop offset="70%" stop-color="#9f8b92" stop-opacity="0.16"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>

            <!-- Realistic Fabric Gradients & Patterns -->
            <linearGradient id="black-denim-wash" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#141519"/>
              <stop offset="28%" stop-color="#2c2f36"/>
              <stop offset="52%" stop-color="#3a3e47"/>
              <stop offset="75%" stop-color="#25282e"/>
              <stop offset="100%" stop-color="#111216"/>
            </linearGradient>
            <linearGradient id="blue-denim-wash" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#27496d"/>
              <stop offset="32%" stop-color="#5382b0"/>
              <stop offset="52%" stop-color="#75a3cf"/>
              <stop offset="75%" stop-color="#4874a1"/>
              <stop offset="100%" stop-color="#223f5e"/>
            </linearGradient>
            <linearGradient id="corset-black-satin" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#0e0e11"/>
              <stop offset="30%" stop-color="#232329"/>

    // Subtle Web Audio Synthesizer (Zero external audio dependencies)
    const SoundFX = {
      enabled: true,
      ctx: null,
      play(freq = 560, type = 'sine', dur = 0.09) {
        if (!this.enabled) return;
        try {
          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
          }
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.28, this.ctx.currentTime + dur);
          gain.gain.setValueAtTime(0.045, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur + 0.01);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + dur + 0.015);
        } catch (e) {}
      }
    };

      applyZoom() {
        const wrapper = document.getElementById('avatar-transform-wrapper');
        wrapper.style.transform = `translate(${this.state.panX}px, ${this.state.panY}px) scale(${this.state.zoomLevel})`;

      setupPanZoomGestures() {
        const stage = document.getElementById('stage-viewport');
        let dragging = false, sx = 0, sy = 0;

        const start = (x, y) => {
          if (this.state.zoomLevel <= 1) return;
          dragging = true;
          sx = x - this.state.panX;
          sy = y - this.state.panY;
        };
        const move = (x, y) => {
          if (!dragging) return;
          this.state.panX = Math.max(-160, Math.min(160, x - sx));
          this.state.panY = Math.max(-220, Math.min(260, y - sy));
          this.applyZoom();
        };
        const end = () => { dragging = false; };

        stage.addEventListener('mousedown', e => start(e.clientX, e.clientY));
        window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
        window.addEventListener('mouseup', end);
        stage.addEventListener('touchstart', e => {
          if (e.touches.length === 1) start(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        stage.addEventListener('touchmove', e => {
          if (dragging && e.touches.length === 1) move(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        stage.addEventListener('touchend', end);

        let svgStr = serializer.serializeToString(svgEl);
        if (!svgStr.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
          svgStr = svgStr.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
        }

        const canvas = document.getElementById('export-canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        img.onload = () => {
          const grad = ctx.createLinearGradient(0, 0, 1000, 2050);
          grad.addColorStop(0, '#f3e5f5');
          grad.addColorStop(0.5, '#fce7f3');
          grad.addColorStop(1, '#e1bee7');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 1000, 2050);

          ctx.fillStyle = '#6b21a8';
          ctx.font = 'bold 34px Georgia, serif';
          ctx.textAlign = 'center';
          ctx.fillText('MY STYLE AND MY RULES ♡', 500, 68);

          ctx.drawImage(img, 0, 35, 1000, 1985);
          URL.revokeObjectURL(url);
          callback(canvas.toDataURL('image/png'));
        };
        img.src = url;
      },

      takePhoto() {
        SoundFX.play(860, 'triangle', 0.12);
        const flash = document.getElementById('camera-flash');
        flash.classList.add('active');
        setTimeout(() => flash.classList.remove('active'), 85);

        this.saveLookEntry(false);
        this.spawnSparkles(14);
        this.generateAvatarPNG((dataUrl) => {
          this.lastCapturedDataURL = dataUrl;
          document.getElementById('photo-preview-img').src = dataUrl;
          this.openModal('photo');
        });
      },

      downloadLastPhoto() {
        if (!this.lastCapturedDataURL) return;
        const a = document.createElement('a');
        a.href = this.lastCapturedDataURL;
        a.download = `ana-my-style-${Date.now()}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        this.showToast('Foto PNG salva no dispositivo!', 'download');
      },

      saveAndExportPNG() {
        SoundFX.play(760);
        this.saveLookEntry(true);
        this.spawnSparkles(16);
        this.generateAvatarPNG((dataUrl) => {
          const a = document.createElement('a');
          a.href = dataUrl;
          a.download = `my-style-and-my-rules-${Date.now()}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          this.showToast('Visual salvo & PNG exportado!', 'save');
        });
      },

      favoriteCurrentLook() {
        SoundFX.play(690);
        this.saveLookEntry(true);
        this.spawnSparkles(14);
        this.showToast('Look salvo em Favoritos ♡', 'heart');
      },

      saveLookEntry(isFav) {
        const eq = JSON.parse(JSON.stringify(this.state.equipped));
        const main = WARDROBE_ITEMS.find(i => i.id === (eq.dress || eq.top || eq.outerwear));
        const entry = {
          id: 'look_' + Date.now(),
          name: main ? main.name : 'Visual Ana ♡',
          date: new Date().toLocaleDateString('pt-BR'),
          favorite: isFav,
          equipped: eq
        };
        this.savedLooks.unshift(entry);
        if (this.savedLooks.length > 30) this.savedLooks.pop();
        try {
          localStorage.setItem('msmr_ana_looks_v2', JSON.stringify(this.savedLooks));
        } catch (e) {}
      },

      openModal(type) {
        if (type === 'favorites' || type === 'mylooks') {
          document.getElementById('gallery-modal-title').textContent =
            type === 'favorites' ? 'Meus Favoritos ♡' : 'Meus Looks Salvos ♡';
          this.renderGallery(type === 'favorites');
          document.getElementById('modal-gallery').classList.remove('hidden');
        } else {
          document.getElementById('modal-' + type).classList.remove('hidden');
        }
        lucide.createIcons();
      },

      closeModal(type) {
        document.getElementById('modal-' + type).classList.add('hidden');
      },

      renderGallery(onlyFavs) {
        const grid = document.getElementById('gallery-grid');
        const list = onlyFavs ? this.savedLooks.filter(l => l.favorite) : this.savedLooks;

        if (!list.length) {
          grid.innerHTML = `<div class="col-span-2 py-8 text-center text-xs text-white/80">Nenhum look salvo ainda. Clique em "Salvar Visual" ou no coração!</div>`;
          return;
        }

        grid.innerHTML = list.map(look => {
          const tags = Object.values(look.equipped)
            .filter(Boolean)
            .map(id => WARDROBE_ITEMS.find(i => i.id === id)?.name)
            .filter(Boolean)
            .slice(0, 3)
            .join(' • ');

          return `
            <div class="rounded-2xl bg-white/20 border border-white/40 p-3 flex flex-col justify-between gap-2">
              <div>
                <div class="flex items-center justify-between text-[10px] text-pink-200 font-bold">
                  <span>${look.date}</span>
                  <button onclick="StudioApp.deleteLook('${look.id}', ${onlyFavs})" class="text-white/70 hover:text-white">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
                <h4 class="text-xs font-bold text-white truncate mt-0.5">${look.name}</h4>
                <p class="text-[10px] text-white/80 line-clamp-2 mt-1">${tags}</p>
              </div>
              <button onclick="StudioApp.equipSavedLook('${look.id}')"
                class="w-full py-1.5 rounded-full bg-white/85 text-purple-950 font-bold text-[11px] hover:bg-white transition">
                Vestir na Ana
              </button>
            </div>
          `;
        }).join('');
        lucide.createIcons();
      },

      equipSavedLook(id) {
        const found = this.savedLooks.find(l => l.id === id);
        if (!found) return;
        this.state.equipped = JSON.parse(JSON.stringify(found.equipped));
        this.pushHistory();
        this.renderWardrobeGrid();
        this.renderQuickStrip();
        this.renderAvatar(true);
        this.closeModal('gallery');
        this.showToast(`Look "${found.name}" vestido!`, 'sparkles');
      },

      deleteLook(id, onlyFavs) {
        this.savedLooks = this.savedLooks.filter(l => l.id !== id);
        try {
          localStorage.setItem('msmr_ana_looks_v2', JSON.stringify(this.savedLooks));
        } catch (e) {}
        this.renderGallery(onlyFavs);
      },

      // Settings Controls
      toggleAnimations(enabled) {
        document.getElementById('studio-root').classList.toggle('paused-anims', !enabled);
      },

      toggleMirrorLights(enabled) {
        document.getElementById('mirror-fairy-lights').style.display = enabled ? 'block' : 'none';
      },

      toggleSound(enabled) {
        SoundFX.enabled = enabled;
      },

      // Natural Eye Blinking Loop
      setupBlinkLoop() {
        const loop = () => {
          const eyes = document.getElementById('eyes-blink-group');
          if (eyes && !document.getElementById('studio-root').classList.contains('paused-anims')) {
            eyes.classList.add('eyelid-closed');
            setTimeout(() => eyes.classList.remove('eyelid-closed'), 115);
          }
          setTimeout(loop, 2700 + Math.random() * 3400);
        };
        setTimeout(loop, 2200);
      },

      spawnSparkles(count = 12) {
        const layer = document.getElementById('sparkle-layer');
        for (let i = 0; i < count; i++) {
          const el = document.createElement('div');
          el.textContent = '✦';
          el.style.position = 'absolute';
          el.style.left = (22 + Math.random() * 44) + '%';
          el.style.top = (22 + Math.random() * 52) + '%';
          el.style.color = Math.random() > 0.4 ? '#ffffff' : '#f9a8d4';
          el.style.fontSize = (13 + Math.random() * 14) + 'px';
          el.style.textShadow = '0 0 8px rgba(255,255,255,0.9)';
          el.style.animation = 'sparkleRise 1.1s ease-out forwards';
          layer.appendChild(el);
          setTimeout(() => el.remove(), 1150);
        }
      },

      showToast(text, icon) {
        const banner = document.getElementById('toast-banner');
        document.getElementById('toast-text').textContent = text;
        document.getElementById('toast-icon').innerHTML = `<i data-lucide="${icon}" class="w-3.5 h-3.5"></i>`;
        lucide.createIcons();
        banner.classList.remove('opacity-0', '-translate-y-2');
        clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(() => {
          banner.classList.add('opacity-0', '-translate-y-2');
        }, 2100);
      }
    };

    window.addEventListener('DOMContentLoaded', () => StudioApp.init());
  </script>
</body>
</html>
